<app-navbar></app-navbar>

<div class="login-wrapper">
  <div class="login-card">

    <div class="brand-panel">
      <div class="brand-badge">Clínica VitalCare</div>
      <h1>Inicia sesión</h1>
      <p>
        Accede con tu correo y contraseña para revisar tu información y continuar
        con tus atenciones en la clínica.
      </p>

      <div class="brand-decoration">
        <div class="pulse-circle"></div>
        <div class="pulse-circle delay"></div>
      </div>

      <div class="registro-brand-container" *ngIf="mostrarRegistro">
        <button type="button" class="link-registro-brand" (click)="irARegistro()">
          ¿Desea registrarse?
        </button>
      </div>
    </div>

    <div class="form-panel">
      <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        <div class="form-grid">

          <div class="input-group full-width">
            <label for="correo">Correo</label>
            <input
              id="correo"
              type="email"
              formControlName="correo"
              placeholder="correo@ejemplo.com"
            >
            <small *ngIf="campoInvalido('correo')">Ingresa un correo válido.</small>
          </div>

          <div class="input-group full-width">
            <label for="contrasenia">Contraseña</label>
            <input
              id="contrasenia"
              type="password"
              formControlName="contrasenia"
              placeholder="Ingresa tu contraseña"
            >
            <small *ngIf="campoInvalido('contrasenia')">
              La contraseña es obligatoria y debe tener al menos 8 caracteres.
            </small>
          </div>

          <div *ngIf="mensajeExito" class="estado-box exito full-width">
            {{ mensajeExito }}
          </div>

          <div *ngIf="mensajeError" class="estado-box error full-width">
            {{ mensajeError }}
          </div>

          <div class="full-width">
            <button type="submit" class="btn-login" [disabled]="cargando">
              <span *ngIf="!cargando">Ingresar</span>
              <span *ngIf="cargando">Cargando...</span>
            </button>
          </div>

        </div>
      </form>
    </div>

  </div>
</div>
